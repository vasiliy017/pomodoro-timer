appId: dev.pomodoro-timer.app
productName: Pomodoro Timer
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  # v1 ships unsigned (ADR-0001, idea-brief §7): no signing identity, no notarization.
  identity: null
  notarize: false
  extendInfo:
    # Keeps the one deadline timeout on time with the window closed (ADR-0004, focus-timer-core).
    NSAppSleepDisabled: true
dmg:
  sign: false
publish: null
